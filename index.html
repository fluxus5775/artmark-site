<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art:mark · Meta:mark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root { --bg:#FAFAF7; --fg:#141414; --sub:#5F5F5A; --line:#E2E2DC; --accent:#FF4A11; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111110; --fg:#F2F2EE; --sub:#A8A8A2; --line:#2C2C29; color-scheme:dark; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 "Inter","Noto Sans KR",system-ui,sans-serif; padding:0 max(20px, env(safe-area-inset-left)); }
  .wrap { max-width:680px; margin:0 auto; padding:64px 0; }
  .brand { font-family:"Bebas Neue",Impact,sans-serif; font-size:56px; line-height:1; margin:0; }
  .brand span { color:var(--accent); }
  p { color:var(--sub); }
  ul { list-style:none; padding:0; margin:40px 0 0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); } a { display:block; padding:16px 0; color:inherit; text-decoration:none; }
</style>
</head>
<body>
<main class="wrap">
  <h1 class="brand">ART<span>:</span>MARK<br>META<span>:</span>MARK</h1>
  <p>마크피프티파이브 (mark55)</p>
  <ul>
    <li><a href="account-deletion/">계정 삭제 안내 · Account Deletion →</a></li>
  </ul>
</main>
</body>
</html>
